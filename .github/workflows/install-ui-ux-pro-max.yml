name: Install UI UX Pro Max for Codex

on:
  push:
    branches:
      - codex/install-official-ui-ux-pro-max
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: codex/install-official-ui-ux-pro-max

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install official CLI
        run: npm install -g ui-ux-pro-max-cli

      - name: Generate official Codex skill
        run: uipro init --ai codex --force

      - name: Commit generated skill
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- .agents
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git commit -m "chore: install official UI UX Pro Max Codex skill"
          git push origin HEAD:codex/install-official-ui-ux-pro-max
