name: Validate UI UX Pro Max homepage rebuild

on:
  push:
    branches:
      - codex/homepage-uiux-promax-rebuild

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-package-lock --no-audit --no-fund
      - run: npm run build
