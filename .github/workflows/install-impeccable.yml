name: Install Impeccable for Codex

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/install-impeccable.yml'

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Impeccable for Codex
        run: npx --yes impeccable@latest skills install -y --providers=codex --scope=project

      - name: Verify installed files
        run: |
          test -f .agents/skills/impeccable/SKILL.md
          test -f .codex/hooks.json
          node .agents/skills/impeccable/scripts/detect.mjs --help >/dev/null

      - name: Commit installation and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/install-impeccable.yml
          git add -- .agents/skills/impeccable .codex/hooks.json .github/workflows/install-impeccable.yml
          if [ -f .impeccable/config.json ]; then git add -- .impeccable/config.json; fi
          git commit -m "chore: install Impeccable skill for Codex"
          git push origin HEAD:main
