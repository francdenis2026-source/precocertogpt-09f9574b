name: Taste homepage v2

on:
  push:
    branches:
      - feat/taste-homepage-v2

permissions:
  contents: write

jobs:
  redesign:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/taste-homepage-v2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply second Taste Skill redesign
        shell: python
        run: |
          from pathlib import Path
          home = Path('src/components/TrueHomepage.tsx')
          text = home.read_text()
          marker = 'import "./TrueHomepageTasteDeep.css";'
          addon = marker + '\nimport "./TrueHomepageTasteV2.css";'
          if 'TrueHomepageTasteV2.css' not in text:
              text = text.replace(marker, addon)
          text = text.replace('Seu dinheiro vale mais quando você <strong>compara antes.</strong>', 'Compare antes. <strong>Compre com mais clareza.</strong>')
          text = text.replace('Encontre produtos, compare preços dos comércios de Feijó e descubra rapidamente onde comprar melhor.', 'Pesquise um produto e veja, em poucos segundos, como os preços variam entre os comércios de Feijó.')
          text = text.replace('PreçoCerto • comparação local de preços', 'Feijó-AC • informação local para comprar melhor')
          home.write_text(text)

          css = Path('src/components/TrueHomepageTasteV2.css')
          css.write_text(r'''/* Taste Skill v2 — market-local premium direction. */
          .true-home{--v2-navy:#071923;--v2-navy-2:#0d2833;--v2-cream:#f6f4ed;--v2-paper:#fbfaf6;--v2-ink:#10252d;--v2-muted:#6d7e83;--v2-green:#178061;--v2-green-soft:#dceee6;--v2-line:#d9e0dd;background:var(--v2-paper);color:var(--v2-ink)}
          .th-shell{width:min(1240px,calc(100% - 56px))}

          /* Header: floating utility bar rather than a heavy nav strip */
          .th-header{top:12px;margin:0 auto;width:min(1240px,calc(100% - 32px));border:1px solid #ffffff18;border-radius:18px;background:#071923e8;backdrop-filter:blur(16px) saturate(120%);box-shadow:0 16px 44px #00101828;overflow:hidden}
          .th-header__inner{height:66px;padding-inline:16px}.th-brand{gap:12px}.th-brand img{width:136px}.th-brand span{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:#9fb1b8}
          .th-nav{gap:2px}.th-nav a,.th-login{padding:10px 13px;border-radius:9px;color:#d7e1e4;font-size:13px;font-weight:650}.th-nav a:hover,.th-login:hover{background:#ffffff0d}
          .th-header__cta{min-height:40px;padding-inline:15px;background:#eef8f3!important;color:#0b4032!important;box-shadow:none!important}

          /* Hero: editorial split, calmer photography, no dashboard feeling */
          .th-hero{min-height:680px;margin-top:-90px;padding-top:90px;background:var(--v2-navy);border-bottom-left-radius:32px;border-bottom-right-radius:32px;overflow:hidden}
          .th-hero__image{background-position:center 46%;filter:saturate(.72) contrast(1.04) brightness(.92)!important;transform:none!important}
          .th-hero__overlay{background:linear-gradient(90deg,#061923fb 0%,#061923f4 37%,#061923ba 61%,#0619234d 100%),linear-gradient(180deg,#06192314 45%,#061923b8 100%)}
          .th-hero__content{min-height:590px;grid-template-columns:minmax(0,1.38fr) minmax(240px,.62fr);gap:96px;padding:118px 0 70px;align-items:end}
          .th-local-context{color:#b9c9ce;font-size:12px;letter-spacing:.01em}.th-local-context svg{color:#8bcdb3}.th-local-context span{color:#77919a}
          .th-hero h1{max-width:800px;margin:20px 0 22px;font-size:clamp(3.35rem,5.7vw,5.75rem);line-height:.92;letter-spacing:-.036em;font-weight:720}.th-hero h1 strong{display:block;color:#f5f1e6;font-weight:760}
          .th-hero__copy>p{max-width:590px;color:#c7d4d8;font-size:18px;line-height:1.65;margin-bottom:30px}
          .th-trust{gap:18px;margin-top:17px}.th-trust span{color:#9fb1b7;font-size:11px}.th-trust svg{color:#78bfa3}

          /* Search: oversized command surface, less generic form styling */
          .th-search-wrap{max-width:760px;position:relative}.th-search{max-width:none;display:grid;grid-template-columns:auto 1fr auto;gap:10px;padding:8px 8px 8px 18px;border:1px solid #ffffff26;border-radius:18px;background:#fbfaf7;box-shadow:0 24px 70px #0000004a}
          .th-search>svg{width:22px;color:#567177}.th-search input{height:52px;font-size:17px;color:#11292f}.th-search input::placeholder{color:#829398}.th-search button{height:52px;min-width:132px;border-radius:12px;background:#176f57;color:#fff;box-shadow:none;font-size:14px;letter-spacing:.01em}
          .th-search:focus-within{box-shadow:0 26px 80px #0000005c,0 0 0 3px #b7ddce70}
          .th-search-results{margin-top:10px;border-radius:16px!important;border:1px solid #d9e1de!important;background:#fffdfa!important;box-shadow:0 24px 60px #0719232e!important;overflow:hidden}
          .th-search-result{padding:13px 14px!important}.th-search-result:hover{background:#eff6f2!important}.th-search-result__price{color:#0b6c50!important;font-variant-numeric:tabular-nums}

          /* Hero stats become a quiet field note */
          .th-hero-card{padding:20px 0 4px 24px;border-left:1px solid #ffffff1e}.th-hero-card__label{font-size:11px;color:#829ca6;letter-spacing:.05em;text-transform:uppercase}.th-hero-card__stats{margin:15px 0}.th-hero-card__stats div{padding:12px 0}.th-hero-card__stats strong{font-size:28px;font-weight:680}.th-hero-card__stats span{font-size:11px}.th-hero-card>a{font-size:12px;color:#b7dbc9}

          /* Quick actions feel like a strip, not 3 cloned cards */
          .th-quick{margin-top:-26px}.th-quick__grid{grid-template-columns:1.45fr .8fr .8fr;gap:0;border:1px solid #dfe4df;border-radius:17px;background:#fffdfa;box-shadow:0 16px 40px #0b263016;overflow:hidden}.th-quick__grid>a{min-height:82px;border:0;border-right:1px solid #e2e6e1;border-radius:0;background:transparent;box-shadow:none;padding:14px 18px}.th-quick__grid>a:last-child{border-right:0}.th-quick__grid>a:first-child{background:#eff7f2}.th-quick__grid>a:hover{background:#f5f7f4;box-shadow:none}.th-quick__grid>a>span{width:38px;height:38px;border-radius:10px;background:#e3efe9}

          /* Main homepage follows a warmer, more editorial rhythm */
          .th-section{padding:92px 0}.th-opportunities{background:var(--v2-paper)}.th-heading{margin-bottom:38px}.th-heading h2,.th-basket-mini h2,.th-merchant h2{font-weight:700;letter-spacing:-.03em}.th-heading span,.th-section-note{color:#718085!important}.th-heading>a{color:#176f57}
          .th-product{background:#fffdfa;border-color:#dfe4df}.th-product__media{background:#f1f1ec}.th-product__price strong{color:#0d7357}.th-product__topline button{background:#fffdfa}
          .th-discover{background:var(--v2-cream)}.th-basket-mini{background:#123c35;border-radius:20px}.th-store:hover{background:#ffffff8c}
          .th-merchant{background:#0b2c35}.th-merchant .th-button--light{background:#f5f0e4;color:#17383d}

          /* Footer: quieter institutional ending with better spacing */
          .th-footer{padding:42px 0 36px;background:#06171f;border-top:1px solid #ffffff10}.th-footer__row{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:34px}.th-footer__brand{align-items:center}.th-footer__brand img{width:132px}.th-footer__brand span{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:#8198a1}.th-footer nav{justify-self:center;margin:0;display:flex;gap:4px}.th-footer nav a{padding:8px 10px;border-radius:8px;color:#a9bac0;font-size:12px}.th-footer nav a:hover{background:#ffffff0a;color:#fff}.th-footer small{margin:0;text-align:right;max-width:210px;line-height:1.45;color:#6f8790;font-size:10px}

          .true-home :where(a,button,input):focus-visible{outline:3px solid #8fcbb4!important;outline-offset:3px}

          @media(max-width:960px){.th-header{top:8px;width:calc(100% - 20px)}.th-hero{margin-top:-82px;padding-top:82px}.th-hero__content{grid-template-columns:1fr;gap:28px;padding-top:100px}.th-hero-card{max-width:540px;border-left:0;border-top:1px solid #ffffff20;padding:18px 0 0}.th-quick__grid{grid-template-columns:1.2fr 1fr 1fr}.th-footer__row{grid-template-columns:1fr auto}.th-footer nav{grid-column:1/-1;grid-row:2;justify-self:start}.th-footer small{grid-column:2;grid-row:1}}
          @media(max-width:640px){.th-shell{width:calc(100% - 28px)}.th-header{border-radius:14px}.th-header__inner{height:60px;padding-inline:12px}.th-hero{border-bottom-left-radius:22px;border-bottom-right-radius:22px}.th-hero__content{padding:98px 0 50px}.th-hero h1{font-size:clamp(2.8rem,13.2vw,4rem);line-height:.94}.th-hero__copy>p{font-size:16px}.th-search{grid-template-columns:auto 1fr;padding:7px 7px 7px 15px;border-radius:15px}.th-search button{grid-column:1/-1;width:100%;min-width:0}.th-quick{margin-top:-14px}.th-quick__grid{grid-template-columns:1fr;border-radius:14px}.th-quick__grid>a{border-right:0;border-bottom:1px solid #e2e6e1}.th-quick__grid>a:last-child{border-bottom:0}.th-section{padding:60px 0}.th-footer{padding:34px 0}.th-footer__row{display:flex;align-items:flex-start;flex-direction:column;gap:16px}.th-footer nav{display:flex;flex-wrap:wrap;gap:2px}.th-footer small{text-align:left;max-width:none}}
          @media(prefers-reduced-motion:reduce){.true-home *{transition-duration:.01ms!important;animation-duration:.01ms!important;animation-iteration-count:1!important}}
          ''')
      - name: Install dependencies
        run: npm install --package-lock=false --no-audit --no-fund
      - name: Build
        run: npm run build
      - name: Verify design skills
        run: |
          test -f .agents/skills/design-taste-frontend/SKILL.md
          test -f .agents/skills/high-end-visual-design/SKILL.md
          node .agents/skills/impeccable/scripts/hook.mjs </dev/null || true
      - name: Commit redesign
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- src/components/TrueHomepage.tsx src/components/TrueHomepageTasteV2.css
          git commit -m "design: apply second Taste Skill homepage redesign" || true
          git rm .github/workflows/taste-homepage-v2.yml
          git commit -m "chore: remove temporary Taste v2 workflow" || true
          git push origin HEAD:feat/taste-homepage-v2
