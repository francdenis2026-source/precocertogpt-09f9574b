name: Taste header modal guard

on:
  pull_request:
    paths:
      - 'src/pages/HomePremiumTasteRefinement.css'
      - 'src/main.tsx'
      - 'docs/taste-header-modal-audit.md'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Instalar dependências
        run: npm install --no-audit --no-fund
      - name: Testes
        run: npm test
      - name: Build
        run: npm run build
