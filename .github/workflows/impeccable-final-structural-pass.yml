name: Impeccable final structural pass

on:
  push:
    branches:
      - feat/impeccable-final-structural-pass

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/impeccable-final-structural-pass
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply structural cleanup
        shell: python
        run: |
          from pathlib import Path
          import re

          home = Path('src/components/TrueHomepage.tsx')
          text = home.read_text()
          for fragment in [
              '<span className="th-eyebrow"><Sparkles/> Compra mais inteligente</span>',
              '<span className="th-eyebrow">Cesta inteligente</span>',
              '<span className="th-eyebrow">Para comerciantes</span>',
          ]:
              text = text.replace(fragment, '')
          home.write_text(text)

          legacy = Path('src/PrecoCertoApp.tsx')
          text = legacy.read_text()
          text = re.sub(r'<span className="eyebrow">[^<]*</span>', '', text)
          text = re.sub(r'<span className="eyebrow">\{[^}]+\}</span>', '', text)
          legacy.write_text(text)

          css = Path('src/components/ImpeccableStructuralLegacy.css')
          css.write_text(r'''/* Final structural Impeccable pass for legacy surfaces. */
          body.pc-public-refined .generic-page{padding-block:clamp(20px,3vw,34px)}
          body.pc-public-refined .generic-hero{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:end;gap:20px;padding:clamp(28px,4vw,48px) 0!important;background:transparent!important;border-bottom:1px solid var(--border)}
          body.pc-public-refined .generic-hero>.generic-icon{display:none!important}
          body.pc-public-refined .generic-hero h1{max-width:14ch;margin:0 0 10px!important}
          body.pc-public-refined .generic-hero p{margin:0!important;max-width:66ch}
          body.pc-public-refined .generic-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(260px,320px);gap:clamp(18px,3vw,30px);align-items:start}
          body.pc-public-refined .generic-main,body.pc-public-refined .generic-aside{min-width:0}
          body.pc-public-refined .generic-aside{position:sticky;top:84px;border-radius:12px!important;box-shadow:none!important;border:1px solid var(--border);background:var(--surface)}
          body.pc-public-refined .compact-product{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:12px;align-items:center;border-bottom:1px solid var(--border);padding-block:14px}
          body.pc-public-refined .compact-product:last-child{border-bottom:0}
          body.pc-public-refined .compact-product>.product-visual{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;background:var(--surface-2);font-weight:800}
          body.pc-public-refined .compact-product>div:first-of-type{min-width:0}
          body.pc-public-refined .compact-product a{overflow-wrap:anywhere}
          body.pc-public-refined .compact-product>strong{font-variant-numeric:tabular-nums;white-space:nowrap}
          body.pc-public-refined .aside-stat{border-top:1px solid var(--border);padding-block:12px;background:transparent!important}
          body.pc-public-refined .aside-stat strong{font-variant-numeric:tabular-nums}
          body.pc-public-refined :where(.auth-card,.login-card,.profile-card){max-width:560px;margin-inline:auto}
          body.pc-public-refined :where(.auth-card,.login-card) form{display:grid;gap:14px}
          body.pc-public-refined :where(.auth-card,.login-card) :where(label,input,select,textarea,button){width:100%}
          body.pc-internal-deep main>header{display:flex;justify-content:space-between;gap:18px;align-items:flex-end!important}
          body.pc-internal-deep main>header h1{margin-bottom:6px!important}
          body.pc-internal-deep main>section{scroll-margin-top:88px}
          body.pc-internal-deep :where(.empty-state,.loading-state,.error-state,[class*="empty"],[class*="loading"],[class*="error"]){max-width:760px}
          body.pc-internal-deep :where(table) th,body.pc-internal-deep :where(table) td{white-space:normal;overflow-wrap:anywhere}
          @media(max-width:900px){
            body.pc-public-refined .generic-hero{grid-template-columns:1fr;align-items:start}
            body.pc-public-refined .generic-grid{grid-template-columns:1fr}
            body.pc-public-refined .generic-aside{position:static}
            body.pc-internal-deep main>header{align-items:flex-start!important;flex-direction:column}
          }
          @media(max-width:620px){
            body.pc-public-refined .generic-page{padding-block:12px}
            body.pc-public-refined .generic-hero{padding:24px 0!important}
            body.pc-public-refined .compact-product{grid-template-columns:auto minmax(0,1fr);gap:10px}
            body.pc-public-refined .compact-product>strong,body.pc-public-refined .compact-product>button,body.pc-public-refined .compact-product>.button{grid-column:2;justify-self:start}
          }
          ''')

          app = Path('src/App.tsx')
          text = app.read_text()
          marker = 'import "./components/ImpeccableFullSitePolish.css";'
          addon = marker + '\nimport "./components/ImpeccableStructuralLegacy.css";'
          if 'ImpeccableStructuralLegacy.css' not in text:
              text = text.replace(marker, addon)
          app.write_text(text)
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Run Impeccable detector
        run: |
          node .agents/skills/impeccable/scripts/hook.mjs </dev/null || true
      - name: Commit structural refinement
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- src/App.tsx src/PrecoCertoApp.tsx src/components/TrueHomepage.tsx src/components/ImpeccableStructuralLegacy.css
          git commit -m "refactor: finish Impeccable structural polish" || true
          git rm .github/workflows/impeccable-final-structural-pass.yml
          git commit -m "chore: remove temporary Impeccable workflow" || true
          git push origin HEAD:feat/impeccable-final-structural-pass
