name: Taste Dorinha and checkout v2

on:
  push:
    branches:
      - feat/taste-dorinha-checkout-v2

permissions:
  contents: write

jobs:
  redesign:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/taste-dorinha-checkout-v2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply Taste Skill redesign
        shell: python
        run: |
          from pathlib import Path

          author = Path('src/components/DorinhaAuthorStoreProMax.tsx')
          text = author.read_text()
          marker = 'import "./DorinhaCheckoutProMax.css";'
          if 'DorinhaTasteV2.css' not in text:
              text = text.replace(marker, marker + '\nimport "./DorinhaTasteV2.css";')
          text = text.replace('<span className="dorinha-pro__eyebrow"><Feather/> Literatura acreana em destaque</span>', '<span className="dorinha-pro__signature"><Feather/> Dorinha Barroso · literatura acreana</span>')
          text = text.replace('<div><span>Uma vitrine autoral</span><h2>Literatura local apresentada com a atenção que cada obra merece.</h2></div>', '<div><span className="dorinha-pro__section-note">Acervo autoral</span><h2>Quatro livros, uma trajetória literária feita no Acre.</h2></div>')
          text = text.replace('<div><span>Biblioteca da autora</span><h2>Escolha sua próxima leitura.</h2></div>', '<div><span className="dorinha-pro__section-note">Obras disponíveis</span><h2>Escolha sua próxima leitura.</h2></div>')
          author.write_text(text)

          storefront = Path('src/components/MerchantStorefront.tsx')
          s = storefront.read_text()
          marker2 = 'import "./MerchantStorefrontProMax.css";'
          if 'DorinhaCheckoutTasteV2.css' not in s:
              s = s.replace(marker2, marker2 + '\nimport "./DorinhaCheckoutTasteV2.css";')
          s = s.replace('<span className="storefront-pro__author-mark"><Feather/> Edição autoral · Acre</span>', '<span className="storefront-pro__author-mark"><Feather/> Dorinha Barroso · edição autoral no Acre</span>')
          s = s.replace('<span className="storefront-pro__eyebrow">{isDorinha?"COMPRA DIRETA":"LOJA ONLINE"}</span>', '<span className="storefront-pro__eyebrow">{isDorinha?"Escolha seus livros":"LOJA ONLINE"}</span>')
          storefront.write_text(s)

          Path('src/components/DorinhaTasteV2.css').write_text(r'''/* Taste Skill v2 — Dorinha author page. Editorial commerce, restrained motion. */
          .dorinha-pro{--dt-ink:#352638;--dt-plum:#4b2a4c;--dt-plum-deep:#251427;--dt-rose:#9d6c7a;--dt-cream:#fffaf5;--dt-paper:#f7f0eb;--dt-gold:#c8a96d;--dt-line:#e4d8d7;--dt-muted:#756871;background:linear-gradient(180deg,#fffaf6 0%,#fff 28%,#f8f3ef 100%);color:var(--dt-ink)}
          .dorinha-pro :where(h1,h2,h3){text-wrap:balance}.dorinha-pro :where(p,small){text-wrap:pretty}
          .dorinha-pro__top{width:min(1180px,calc(100% - 32px));top:14px;margin:0 auto;border:1px solid rgba(88,53,85,.13)!important;border-radius:16px!important;background:rgba(255,250,247,.93)!important;box-shadow:0 14px 36px rgba(64,36,61,.08)!important;backdrop-filter:blur(16px);padding-inline:18px!important}
          .dorinha-pro__brand{font-weight:780;letter-spacing:-.01em}.dorinha-pro__brand span{font-weight:520!important;color:#8a7b84!important}.dorinha-pro__top nav a,.dorinha-pro__top nav button{border-radius:9px!important;transition:background-color 160ms ease,color 160ms ease,transform 140ms ease!important}.dorinha-pro__top nav button:active,.dorinha-pro__top nav a:active{transform:scale(.98)}
          .dorinha-pro__hero--v4{max-width:1240px;margin:26px auto 0;min-height:610px;border-radius:28px;overflow:hidden;display:grid!important;grid-template-columns:minmax(0,1.12fr) minmax(360px,.88fr)!important;align-items:stretch!important;background:#2c182d!important;box-shadow:0 28px 70px rgba(55,30,53,.14)}
          .dorinha-pro__hero-bg{filter:saturate(.82) contrast(1.03);opacity:.52}.dorinha-pro__hero--v4:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(34,17,35,.96) 0%,rgba(45,24,47,.87) 45%,rgba(45,24,47,.22) 76%,rgba(45,24,47,0) 100%);pointer-events:none}
          .dorinha-pro__hero-copy{position:relative;z-index:2;padding:88px 58px 76px!important;align-self:end}.dorinha-pro__signature{display:inline-flex;align-items:center;gap:8px;color:#e9d6c7;font-size:13px;font-weight:650;letter-spacing:.01em}.dorinha-pro__signature svg{width:16px;color:#d5b574}.dorinha-pro__hero--v4 h1{max-width:740px!important;font-size:clamp(3.4rem,5.7vw,5.7rem)!important;line-height:.92!important;letter-spacing:-.035em!important;margin:20px 0 24px!important}.dorinha-pro__hero--v4 h1 em{color:#e2c993!important;font-style:italic!important;font-weight:600!important}.dorinha-pro__hero-copy>p{max-width:620px!important;font-size:18px!important;line-height:1.62!important;color:#eadfe6!important}
          .dorinha-pro__hero-actions{margin-top:30px!important;gap:10px!important}.dorinha-pro__hero-actions a{min-height:50px!important;border-radius:10px!important;padding:0 19px!important;box-shadow:none!important;transition:transform 140ms ease,background-color 170ms ease,border-color 170ms ease!important}.dorinha-pro__hero-actions a:hover{transform:none!important}.dorinha-pro__hero-actions a:active{transform:scale(.985)!important}.dorinha-pro__hero-actions a:first-child{background:#fff8f3!important;color:#3a243a!important}.dorinha-pro__hero-actions a:last-child{background:#d8ba7b!important;color:#2b1a29!important}
          .dorinha-pro__hero-meta{margin-top:24px!important;gap:18px!important;color:#d4c7ce!important}.dorinha-pro__hero-meta span{font-size:12px!important}.dorinha-pro__hero-portrait{position:relative;z-index:2;height:100%;min-height:610px!important;margin:0!important;border-radius:0!important;background:#e9dfda!important;overflow:hidden}.dorinha-pro__hero-portrait img{width:100%!important;height:100%!important;object-fit:cover!important;object-position:center 18%!important;filter:saturate(.88) contrast(1.02)}.dorinha-pro__hero-portrait:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 58%,rgba(33,18,34,.55));pointer-events:none}.dorinha-pro__hero-portrait>div{z-index:2!important;left:28px!important;bottom:26px!important;border:0!important;background:rgba(31,17,32,.78)!important;backdrop-filter:blur(10px)!important;border-radius:10px!important}
          .dorinha-pro__intro{max-width:1180px!important;margin:0 auto!important;padding:94px 0 60px!important;grid-template-columns:minmax(0,1.25fr) minmax(280px,.75fr)!important;gap:58px!important;border-bottom:1px solid var(--dt-line)}.dorinha-pro__section-note{display:block!important;margin-bottom:12px!important;color:#8c6f78!important;text-transform:none!important;letter-spacing:0!important;font-size:13px!important;font-weight:650!important}.dorinha-pro__intro h2,.dorinha-pro__section-head h2{font-size:clamp(2.4rem,4vw,4rem)!important;line-height:.98!important;letter-spacing:-.03em!important}.dorinha-pro__intro p{font-size:16px!important;line-height:1.75!important;max-width:48ch!important;color:var(--dt-muted)!important}
          .dorinha-pro__catalog{max-width:1180px!important;margin:0 auto!important;padding:72px 0 94px!important}.dorinha-pro__section-head{margin-bottom:32px!important}.dorinha-pro__grid{display:grid!important;grid-template-columns:repeat(12,minmax(0,1fr))!important;gap:16px!important;align-items:start!important}.dorinha-pro__book{grid-column:span 3!important;border:1px solid var(--dt-line)!important;border-radius:14px!important;background:#fff!important;box-shadow:none!important;overflow:hidden!important;transition:border-color 160ms ease,box-shadow 160ms ease,transform 140ms ease!important}.dorinha-pro__book:first-child,.dorinha-pro__book:nth-child(2){grid-column:span 6!important}.dorinha-pro__book:hover{transform:none!important;border-color:#cdb9bd!important;box-shadow:0 14px 34px rgba(57,36,54,.07)!important}.dorinha-pro__book:active{transform:scale(.996)!important}.dorinha-pro__book:first-child .dorinha-pro__cover,.dorinha-pro__book:nth-child(2) .dorinha-pro__cover{min-height:360px!important}.dorinha-pro__cover{min-height:286px!important;background:#f1e9e5!important}.dorinha-pro__cover img{max-height:88%!important;filter:drop-shadow(0 14px 16px rgba(47,28,45,.19))}.dorinha-pro__book-body{padding:22px!important}.dorinha-pro__book-label{letter-spacing:0!important;text-transform:none!important;color:#8a7882!important;font-size:12px!important}.dorinha-pro__book h3{font-size:24px!important;line-height:1.08!important}.dorinha-pro__book p{font-size:14px!important;line-height:1.62!important;color:#756a71!important}.dorinha-pro__book-footer{margin-top:24px!important}.dorinha-pro__book-footer strong{font-variant-numeric:tabular-nums}.dorinha-pro__book-actions a{border-radius:9px!important;box-shadow:none!important}.dorinha-pro__book-actions a:hover{transform:none!important}.dorinha-pro__book-actions a:active{transform:scale(.985)!important}
          .dorinha-pro__author{max-width:1180px!important;margin:0 auto 80px!important;grid-template-columns:minmax(320px,.8fr) minmax(0,1.2fr)!important;gap:52px!important;border-radius:20px!important;background:#332034!important;padding:30px!important}.dorinha-pro__author-photo{min-height:520px!important;border-radius:13px!important;overflow:hidden!important}.dorinha-pro__author-photo img{object-position:center top!important}.dorinha-pro__author-copy{padding:36px 30px 36px 4px!important}.dorinha-pro__author-copy h2{font-size:clamp(3rem,5vw,5rem)!important;color:#fff!important}.dorinha-pro__author-copy>p{font-size:16px!important;line-height:1.75!important;color:#d9ced5!important}.dorinha-pro__facts{border-top:1px solid #ffffff22!important;border-bottom:1px solid #ffffff22!important}.dorinha-pro__facts div{background:transparent!important;border:0!important}.dorinha-pro__facts strong{color:#ead39f!important}.dorinha-pro__facts span{color:#cfc1c8!important}
          .dorinha-pro__pix{max-width:1180px!important;margin:0 auto 76px!important;border:1px solid #d8c8ca!important;border-radius:16px!important;background:#fff!important;box-shadow:none!important;padding:26px 28px!important}.dorinha-pro__pix-icon{border-radius:10px!important;background:#392139!important}.dorinha-pro__pix h2{font-size:2rem!important;letter-spacing:-.025em!important}.dorinha-pro__pix p{font-size:14px!important}.dorinha-pro__pix>a{border-radius:9px!important;box-shadow:none!important}.dorinha-pro__pix>a:hover{transform:none!important}.dorinha-pro__pix>a:active{transform:scale(.985)!important}
          .dorinha-pro__market{background:#f0e8e4!important;padding:64px max(24px,calc((100vw - 1180px)/2))!important}.dorinha-pro__market h2{font-size:clamp(2.2rem,4vw,3.5rem)!important;letter-spacing:-.03em!important}.dorinha-pro__footer{padding:30px max(24px,calc((100vw - 1180px)/2))!important;background:#241426!important;border:0!important;color:#f4ecef!important}.dorinha-pro__footer span{color:#cbbdc4!important}.dorinha-pro__footer a{color:#e4ca94!important}
          html[data-theme="dark"] .dorinha-pro{background:#181116;color:#f3ebef}html[data-theme="dark"] .dorinha-pro__top{background:rgba(31,22,28,.94)!important;border-color:#4a3943!important}html[data-theme="dark"] .dorinha-pro__intro{border-color:#40333a}html[data-theme="dark"] .dorinha-pro__intro p{color:#c1b4ba!important}html[data-theme="dark"] .dorinha-pro__book{background:#21191d!important;border-color:#40343a!important}html[data-theme="dark"] .dorinha-pro__cover{background:#2a2125!important}html[data-theme="dark"] .dorinha-pro__book p{color:#bfb1b7!important}html[data-theme="dark"] .dorinha-pro__pix{background:#21191d!important;border-color:#40343a!important}
          @media(max-width:980px){.dorinha-pro__hero--v4{grid-template-columns:1fr!important}.dorinha-pro__hero-portrait{min-height:460px!important}.dorinha-pro__intro{padding-inline:24px!important}.dorinha-pro__catalog{padding-inline:24px!important}.dorinha-pro__grid{grid-template-columns:repeat(2,minmax(0,1fr))!important}.dorinha-pro__book,.dorinha-pro__book:first-child,.dorinha-pro__book:nth-child(2){grid-column:auto!important}.dorinha-pro__author{margin-inline:24px!important;grid-template-columns:1fr!important}.dorinha-pro__author-copy{padding:20px 10px 12px!important}}
          @media(max-width:640px){.dorinha-pro__top{width:calc(100% - 20px);top:8px;border-radius:13px!important}.dorinha-pro__hero--v4{margin-top:18px;border-radius:18px;min-height:auto}.dorinha-pro__hero-copy{padding:54px 22px 40px!important}.dorinha-pro__hero--v4 h1{font-size:clamp(3rem,14vw,4rem)!important}.dorinha-pro__hero-copy>p{font-size:16px!important}.dorinha-pro__hero-portrait{min-height:390px!important}.dorinha-pro__intro{padding:58px 18px 44px!important;grid-template-columns:1fr!important;gap:20px!important}.dorinha-pro__catalog{padding:48px 18px 64px!important}.dorinha-pro__grid{display:flex!important;overflow-x:auto!important;gap:12px!important;padding-bottom:12px!important;scroll-snap-type:x mandatory}.dorinha-pro__book,.dorinha-pro__book:first-child,.dorinha-pro__book:nth-child(2){flex:0 0 min(84vw,340px)!important;scroll-snap-align:start}.dorinha-pro__cover,.dorinha-pro__book:first-child .dorinha-pro__cover,.dorinha-pro__book:nth-child(2) .dorinha-pro__cover{min-height:310px!important}.dorinha-pro__author{margin:0 12px 52px!important;padding:14px!important}.dorinha-pro__author-photo{min-height:410px!important}.dorinha-pro__pix{margin:0 12px 52px!important}.dorinha-pro__market{padding:48px 18px!important}.dorinha-pro__footer{padding:26px 18px!important}}
          @media(prefers-reduced-motion:reduce){.dorinha-pro *{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
          ''')

          Path('src/components/DorinhaCheckoutTasteV2.css').write_text(r'''/* Taste Skill v2 — only Dorinha checkout (storefront-pro--author). Payment logic untouched. */
          .storefront-pro--author{--dc-ink:#352638;--dc-plum:#3f2341;--dc-deep:#251427;--dc-gold:#c9aa6d;--dc-paper:#fffaf6;--dc-line:#e3d7d7;--dc-muted:#786a72;background:linear-gradient(180deg,#fffaf6 0%,#f7f1ed 100%);color:var(--dc-ink)}
          .storefront-pro--author :where(h1,h2,h3){text-wrap:balance}.storefront-pro--author :where(p,small){text-wrap:pretty}
          .storefront-pro--author .storefront-pro__top{width:min(1180px,calc(100% - 32px));top:14px;margin:0 auto;border:1px solid rgba(86,53,84,.13);border-radius:16px;background:rgba(255,250,247,.94);backdrop-filter:blur(16px);box-shadow:0 14px 36px rgba(66,38,64,.08);padding-inline:18px}.storefront-pro--author .storefront-pro__back,.storefront-pro--author .storefront-pro__top-actions a,.storefront-pro--author .storefront-pro__theme{border-radius:9px!important}.storefront-pro--author .storefront-pro__theme:active,.storefront-pro--author .storefront-pro__top-actions a:active,.storefront-pro--author .storefront-pro__back:active{transform:scale(.98)}
          .storefront-pro--author .storefront-pro__hero{max-width:1240px;margin:28px auto 0;min-height:500px;border-radius:26px;overflow:hidden;display:grid;grid-template-columns:minmax(0,1.12fr) minmax(350px,.88fr);background:#2c192e;box-shadow:0 28px 70px rgba(53,30,51,.13)}.storefront-pro--author .storefront-pro__hero-bg{opacity:.48;filter:saturate(.84) contrast(1.03)}.storefront-pro--author .storefront-pro__hero:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(35,18,36,.97),rgba(49,27,51,.88) 46%,rgba(49,27,51,.18) 78%,transparent);pointer-events:none}.storefront-pro--author .storefront-pro__hero-copy{position:relative;z-index:2;align-self:end;padding:72px 56px 66px}.storefront-pro--author .storefront-pro__author-mark{font-size:13px!important;letter-spacing:0!important;text-transform:none!important;color:#e7d8cf!important}.storefront-pro--author .storefront-pro__eyebrow{margin-top:18px!important;color:#ceb77f!important;font-size:12px!important;letter-spacing:0!important;text-transform:none!important}.storefront-pro--author .storefront-pro__hero h1{font-family:Georgia,"Times New Roman",serif;font-size:clamp(3.5rem,5.5vw,5.6rem)!important;line-height:.92!important;letter-spacing:-.035em!important;margin:7px 0 18px!important;color:#fff!important}.storefront-pro--author .storefront-pro__hero-copy>p{max-width:620px!important;font-size:17px!important;line-height:1.65!important;color:#e3d8df!important}.storefront-pro--author .storefront-pro__hero-meta{gap:17px!important;margin-top:24px!important}.storefront-pro--author .storefront-pro__hero-meta span{font-size:12px!important;color:#d0c4ca!important}.storefront-pro--author .storefront-pro__hero-art{position:relative;z-index:2;height:100%;min-height:500px;margin:0!important;border-radius:0!important;background:#e7ddd8!important}.storefront-pro--author .storefront-pro__hero-art img{width:100%!important;height:100%!important;object-fit:cover!important;object-position:center 18%!important;filter:saturate(.87) contrast(1.02)}.storefront-pro--author .storefront-pro__hero-art:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 58%,rgba(38,20,39,.58));pointer-events:none}.storefront-pro--author .storefront-pro__hero-art figcaption{z-index:2!important;left:25px!important;right:auto!important;bottom:24px!important;border:0!important;border-radius:10px!important;background:rgba(35,19,36,.8)!important;backdrop-filter:blur(10px)}
          .storefront-pro--author .storefront-pro__layout{max-width:1180px!important;margin:0 auto!important;grid-template-columns:minmax(0,1.18fr) minmax(360px,.82fr)!important;gap:34px!important;padding:72px 0 90px!important;align-items:start}.storefront-pro--author .storefront-pro__section-head span,.storefront-pro--author .storefront-pro__checkout-head span{letter-spacing:0!important;text-transform:none!important;color:#8a727d!important;font-size:12px!important}.storefront-pro--author .storefront-pro__section-head h2,.storefront-pro--author .storefront-pro__checkout-head h2{font-family:Georgia,"Times New Roman",serif;letter-spacing:-.028em!important}.storefront-pro--author .storefront-pro__grid{display:grid!important;grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:14px!important}.storefront-pro--author .storefront-pro__product{border:1px solid var(--dc-line)!important;border-radius:14px!important;background:#fff!important;box-shadow:none!important;overflow:hidden!important;transition:border-color 160ms ease,box-shadow 160ms ease,transform 140ms ease!important}.storefront-pro--author .storefront-pro__product:hover{transform:none!important;border-color:#cbb8bc!important;box-shadow:0 12px 30px rgba(56,35,54,.07)!important}.storefront-pro--author .storefront-pro__product.is-selected{border-color:#8e6a78!important;box-shadow:0 0 0 2px rgba(142,106,120,.12)!important}.storefront-pro--author .storefront-pro__image{min-height:278px!important;background:#f0e8e4!important}.storefront-pro--author .storefront-pro__image img{max-height:245px!important;filter:drop-shadow(0 12px 14px rgba(46,27,44,.18))}.storefront-pro--author .storefront-pro__book-number{background:#3f2440!important;color:#ead39c!important;border-radius:7px!important}.storefront-pro--author .storefront-pro__product-body{padding:18px!important}.storefront-pro--author .storefront-pro__product-body>strong{font-family:Georgia,"Times New Roman",serif;font-size:19px!important;line-height:1.15!important}.storefront-pro--author .storefront-pro__price{font-variant-numeric:tabular-nums;color:#5c3e55!important}.storefront-pro--author .storefront-pro__qty{border-radius:9px!important;background:#f8f3f0!important}.storefront-pro--author .storefront-pro__qty button{border-radius:8px!important}.storefront-pro--author .storefront-pro__qty button:active{transform:scale(.94)}
          .storefront-pro--author .storefront-pro__checkout{position:sticky!important;top:96px!important}.storefront-pro--author .storefront-pro__checkout-card{border:1px solid #d8c8cc!important;border-radius:18px!important;background:#fff!important;box-shadow:0 18px 44px rgba(54,33,52,.08)!important;padding:24px!important}.storefront-pro--author .storefront-pro__checkout-head{padding-bottom:18px!important;border-bottom:1px solid #eadfe1!important}.storefront-pro--author .storefront-pro__steps span{background:#432642!important;color:#f0d49b!important}.storefront-pro--author .storefront-pro__steps i{background:#d9cccf!important}.storefront-pro--author .storefront-pro__items{margin:18px 0!important}.storefront-pro--author .storefront-pro__items>div{padding:10px 0!important;border-bottom:1px solid #eee5e7!important}.storefront-pro--author .storefront-pro__delivery{background:#f8f2ef!important;border-radius:10px!important;padding:4px!important}.storefront-pro--author .storefront-pro__delivery button{border-radius:8px!important}.storefront-pro--author .storefront-pro__delivery button.is-active{background:#432642!important;color:#fff!important;box-shadow:none!important}.storefront-pro--author form label{color:#5f4d58!important}.storefront-pro--author form input,.storefront-pro--author form select{border:1px solid #d9cbce!important;border-radius:9px!important;background:#fffdfb!important;transition:border-color 160ms ease,box-shadow 160ms ease!important}.storefront-pro--author form input:focus,.storefront-pro--author form select:focus{border-color:#9b7886!important;box-shadow:0 0 0 3px rgba(155,120,134,.12)!important}.storefront-pro--author .storefront-pro__summary{margin-top:18px!important;border-top:1px solid #e8dddf!important;border-bottom:1px solid #e8dddf!important;padding:14px 0!important;background:transparent!important}.storefront-pro--author .storefront-pro__summary strong{font-size:18px!important}.storefront-pro--author .storefront-pro__payment{margin:18px 0 12px!important;border:1px solid #e0d2d5!important;border-radius:11px!important;background:#faf5f2!important}.storefront-pro--author .storefront-pro__payment>div{background:#432642!important;color:#e9cf93!important;border-radius:8px!important}.storefront-pro--author .storefront-pro__pay{min-height:52px!important;border-radius:10px!important;background:#432642!important;color:#fff!important;box-shadow:none!important;transition:transform 140ms ease,background-color 170ms ease!important}.storefront-pro--author .storefront-pro__pay:hover:not(:disabled){transform:none!important;background:#352035!important}.storefront-pro--author .storefront-pro__pay:active:not(:disabled){transform:scale(.985)!important}.storefront-pro--author .storefront-pro__pay:disabled{opacity:.52!important}.storefront-pro--author .storefront-pro__disclaimer{color:#82737a!important}
