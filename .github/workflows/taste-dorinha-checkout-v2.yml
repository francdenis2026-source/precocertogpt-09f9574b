      - name: Install dependencies
        run: npm install --package-lock=false --no-audit --no-fund
      - name: Build
        run: npm run build
      - name: Verify design skills
        run: |
          test -f .agents/skills/design-taste-frontend/SKILL.md
          test -f .agents/skills/redesign-existing-projects/SKILL.md
          node .agents/skills/impeccable/scripts/hook.mjs </dev/null || true
      - name: Commit redesign
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- src/components/DorinhaAuthorStoreProMax.tsx src/components/DorinhaTasteV2.css src/components/MerchantStorefront.tsx src/components/DorinhaCheckoutTasteV2.css
          git commit -m "design: apply Taste v2 to Dorinha page and checkout" || true
          git rm .github/workflows/taste-dorinha-checkout-v2.yml
          git commit -m "chore: remove temporary Dorinha Taste workflow" || true
          git push origin HEAD:feat/taste-dorinha-checkout-v2
