name: Validate homepage triple skill
on:
  push:
    branches: [feat/homepage-triple-skill-rebuild]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/homepage-triple-skill-rebuild
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Fix dark mode tokens
        run: |
          sed -i 's/#9bad a5/#9bada5/g; s/#9cad a6/#9cada6/g' src/components/TrueHomepageTripleSkill.css
      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-package-lock
      - name: Build
        run: npm run build
      - name: Verify combined design skills
        run: |
          test -f .agents/skills/design-taste-frontend/SKILL.md
          test -f src/components/ImpeccableFullSitePolish.css
          test -f src/components/TrueHomepageKowalski.css
          grep -q 'TrueHomepageTripleSkill.css' src/components/TrueHomepage.tsx
          ! grep -q 'TrueHomepageTasteV2.css' src/components/TrueHomepage.tsx
          ! grep -q 'TrueHomepageKowalski.css' src/components/TrueHomepage.tsx
      - name: Commit validation fixes and remove workflow
        run: |
          rm .github/workflows/validate-homepage-triple-skill.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/TrueHomepageTripleSkill.css .github/workflows/validate-homepage-triple-skill.yml
          git commit -m 'fix: finalize homepage dark mode tokens and remove validator' || true
          git push origin HEAD:feat/homepage-triple-skill-rebuild