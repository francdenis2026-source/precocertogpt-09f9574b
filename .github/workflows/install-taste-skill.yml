name: Install Taste Skill

on:
  push:
    branches:
      - chore/install-taste-skill

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/install-taste-skill
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install taste skill for Codex
        run: npx -y skills@latest add https://github.com/Leonxlnx/taste-skill --agent codex -y
      - name: Verify installed skills
        run: npx -y skills@latest ls --agent codex
      - name: Commit installation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- .agents/skills .codex 2>/dev/null || true
          git commit -m "chore: install Taste Skill for Codex" || true
          git rm .github/workflows/install-taste-skill.yml
          git commit -m "chore: remove temporary Taste Skill workflow" || true
          git push origin HEAD:chore/install-taste-skill
