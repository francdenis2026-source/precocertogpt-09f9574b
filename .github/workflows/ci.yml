name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Instalar dependências
        run: npm ci
      - name: Validar catálogo (antiga rota /api/catalog)
        run: npm test
      - name: Build de produção
        run: npm run build
      - name: Validar preview servido
        run: |
          npx vite preview --port 4173 &
          for i in $(seq 1 30); do curl -sf -o /dev/null http://localhost:4173/ && break; sleep 1; done
          curl -sf http://localhost:4173/ | grep -q "PreçoCerto"
          curl -sf -o /dev/null -w '%{http_code}\n' http://localhost:4173/buscar
